<!-- Our Favorites Section -->
<section class="favorites-section">
  <div class="container">
    <div class="section-header">
      <h2>Our Favorites</h2>
      <a href="shop.html" class="btn-secondary">View All</a>
    </div>

    <!-- Dynamic 6-Card Grid synced directly with products-data.js -->
    <div class="products-grid" id="favorites-grid"></div>
  </div>
</section>

<!-- Include Products Data Script -->
<script src="products-data.js?v=15"></script>
<script>
  // 6 Featured SKUs synced with products-data.js
  const favoriteSkus = [
    "52211693589", // Almond Boost Milk Booster
    "21852692744", // Stretch Mark Treatment Series
    "21677300747", // Baby Hair Vitamin Lotion
    "8654428702",  // Stretch Mark Cream
    "4888764496",  // Intensive Nipple Cream
    "19142404696"  // Baby Skin Vitamin Lotion
  ];

  const favGrid = document.getElementById('favorites-grid');
  
  if (favGrid && typeof productsData !== 'undefined') {
    favGrid.innerHTML = favoriteSkus.map(sku => {
      const item = productsData[sku];
      if (!item) return '';
      return `
        <div class="product-card">
          <a href="product.html?id=${sku}">
            <div class="card-image-wrap">
              <span class="category-badge">${item.category}</span>
              <img src="${item.img}" alt="${item.title}" loading="lazy">
            </div>
            <div class="card-content">
              <h3 class="product-title">${item.title}</h3>
              <div class="card-price">
                <span class="orig-price">${item.origPrice}</span>
                <span class="sale-price">${item.salePrice}</span>
              </div>
            </div>
          </a>
        </div>
      `;
    }).join('');
  }
</script>
